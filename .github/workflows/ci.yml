name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies from the lock file
        # --with web,observability adds requests/prometheus-client (needed by
        # HttpDocumentFetcher and the metrics exporter respectively) on top of
        # the default main+dev install. crewai/ml stay out of CI on purpose --
        # every agent that would use them is designed to run (and be tested)
        # without them installed; installing spacy/xgboost/crewai here would
        # only slow CI down without adding real coverage.
        run: poetry install --with web,observability --no-interaction

      - name: Lint (flake8)
        run: poetry run flake8 magma --count

      - name: Unit + integration tests
        run: poetry run pytest magma/tests/unit magma/tests/integration --cov=magma --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t magma:ci .

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
