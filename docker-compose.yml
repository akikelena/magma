# Full MAGMA stack: Neo4j (graph layer) and Weaviate (vector layer) back
# the Knowledge Repository; the `magma` service is the packaged app
# itself (see Dockerfile), running run_doc_watch as an always-on vendor-
# documentation watcher by default. None of MAGMA's own code requires
# this compose file to be running -- every agent defaults to
# InMemoryGraphStore/InMemoryVectorStore/in-memory audit+review-queue so
# the test suite and the CLI's --demo mode work with zero infrastructure
# -- this is what backs a real, persistent deployment.
#
# Usage:
#   cp .env.example .env               # fill in NEO4J_PASSWORD, ANTHROPIC_API_KEY, ...
#   docker compose up -d               # neo4j, weaviate, and the magma watcher
#   docker compose run --rm magma magma.scripts.bootstrap_schema
#   docker compose run --rm magma magma.scripts.seed_knowledge_repository
#
#   # One-off commands reuse the same image/network without touching the
#   # long-running watcher:
#   docker compose run --rm magma magma.scripts.run_workflow --demo
#   docker compose run --rm magma magma.scripts.review_queue --queue-path /data/reviews.json --list
#
# Neo4j Browser: http://localhost:7474  (bolt on 7687)
# Weaviate REST: http://localhost:8080  (gRPC on 50051)
# MAGMA Prometheus metrics: http://localhost:9090/metrics
version: "3.8"

services:
  neo4j:
    image: neo4j:2025.11-community
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt (matches NEO4J_URI=bolt://localhost:7687 in .env.example)
    environment:
      # Neo4j's single-variable auth format: "<user>/<password>".
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.0
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    ports:
      - "8080:8080"    # REST (matches WEAVIATE_URL=http://localhost:8080 in .env.example)
      - "50051:50051"  # gRPC, required by the v4 weaviate-client used in vector_store.py
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "node1"
      # MAGMA supplies its own MRL-truncated embeddings
      # (text-embedding-3-large truncated to 1024 dims); Weaviate does no
      # vectorization of its own.
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      # Anonymous access is fine for local dev (this compose file is not
      # meant for production use); set WEAVIATE_API_KEY and switch to
      # API-key auth before deploying anywhere reachable off-host.
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  magma:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      WEAVIATE_URL: "http://weaviate:8080"
      WEAVIATE_API_KEY: "${WEAVIATE_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      PROMETHEUS_PORT: "9090"
      # /data is the volume below; both paths are read by run_doc_watch's
      # own --audit-log/--review-queue-path defaults (env-var-driven so
      # this compose file doesn't need to repeat them as command args).
      AUDIT_LOG_PATH: "/data/audit.jsonl"
      REVIEW_QUEUE_PATH: "/data/reviews.json"
      # Uncomment (and the matching bind mount below) to have the watcher
      # actually regenerate + validate + overwrite real template files
      # instead of only classifying changes -- see run_doc_watch.py's
      # --templates-config docs for the YAML shape templates.yaml needs.
      # TEMPLATES_CONFIG_PATH: "/templates/templates.yaml"
    volumes:
      - magma_data:/data
      # - ./templates:/templates
    ports:
      - "9090:9090"   # Prometheus /metrics -- also what the healthcheck below probes
    command: ["magma.scripts.run_doc_watch", "--interval-seconds", "3600"]
    healthcheck:
      # No wget/curl in the slim base image; urllib is stdlib, so this
      # needs nothing extra installed to prove the polling loop is alive
      # and its metrics server actually came up.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  weaviate_data:
  magma_data:
